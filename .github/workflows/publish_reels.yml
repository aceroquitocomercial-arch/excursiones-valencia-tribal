name: Publicar Daily Reel Instagram & Facebook

on:
  schedule:
    # Se ejecuta 5 veces al día entre las 07:00 y las 18:00 (hora de España)
    # Horas en España (CEST / Verano): 07:00, 10:00, 13:00, 16:00, 18:00 (05:00, 08:00, 11:00, 14:00, 16:00 UTC)
    - cron: '0 5,8,11,14,16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo Simulación (Dry Run): Verifica sin publicar ni mover archivos'
        required: false
        type: boolean
        default: false
      specific_video:
        description: 'Clave específica en R2 (opcional, ej: queue/moraig.mp4)'
        required: false
        type: string
        default: ''

concurrency:
  group: publish-reels
  cancel-in-progress: false

jobs:
  publish_reel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Daily Reels Publisher
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      run: |
        CMD="python publish_instagram_reel.py"
        if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
          CMD="$CMD --dry-run"
        fi
        if [ -n "${{ github.event.inputs.specific_video }}" ]; then
          CMD="$CMD --video \"${{ github.event.inputs.specific_video }}\""
        fi
        echo "Ejecutando: $CMD"
        eval $CMD
