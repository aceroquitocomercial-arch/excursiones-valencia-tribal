name: Publicar Daily Reel Instagram, Facebook & YouTube Shorts

on:
  schedule:
    # Disparadores UTC combinados para los 5 horarios de máxima eficiencia en España (Península / Madrid) al minuto :20:
    # - 5 Reels diarios todo el año (Verano e Invierno): 08:20, 11:20, 14:20, 18:20, 20:20 (hora de España)
    #   * Verano (CEST, UTC+2): 06:20, 09:20, 12:20, 16:20, 18:20 UTC
    #   * Invierno (CET, UTC+1): 07:20, 10:20, 13:20, 17:20, 19:20 UTC
    # El script aplica tope estricto de 5 Reels/día en Instagram y 2/día en horas pico (14:20 y 18:20) para Facebook/YouTube
    - cron: '20 6,7,9,10,12,13,16,17,18,19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo Simulación (Dry Run): Verifica sin publicar ni mover archivos'
        required: false
        type: boolean
        default: false
      force_publish:
        description: 'Forzar publicación inmediata (ignorar límite diario de 5 Reels y control de horario)'
        required: false
        type: boolean
        default: false
      specific_video:
        description: 'Clave específica en R2 (opcional, ej: queue/moraig.mp4)'
        required: false
        type: string
        default: ''

concurrency:
  group: publish-reels
  cancel-in-progress: false

jobs:
  publish_reel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Daily Reels Publisher
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      run: |
        CMD="python publish_instagram_reel.py"
        if [ "${{ github.event_name }}" = "schedule" ] || ( [ "${{ github.event.inputs.force_publish }}" != "true" ] && [ -z "${{ github.event.inputs.specific_video }}" ] ); then
          CMD="$CMD --check-schedule"
        fi
        if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
          CMD="$CMD --dry-run"
        fi
        if [ -n "${{ github.event.inputs.specific_video }}" ]; then
          CMD="$CMD --video \"${{ github.event.inputs.specific_video }}\""
        fi
        echo "Ejecutando: $CMD"
        eval $CMD
