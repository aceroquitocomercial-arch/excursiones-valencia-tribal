name: Publicar Daily Reel Instagram & Facebook

on:
  schedule:
    # Disparadores UTC combinados para España (Península / Madrid) en el minuto :10:
    # Se ejecuta en el minuto :10 para evitar retrasos de cola de GitHub Actions en el minuto :00
    # - Verano (CEST, UTC+2): 5 Reels a las 07:10, 10:10, 13:10, 16:10, 18:10 (05, 08, 11, 14, 16 UTC)
    # - Invierno (CET, UTC+1): 6 Reels a las 07:10, 09:10, 12:10, 14:10, 16:10, 18:10 (06, 08, 11, 13, 15, 17 UTC)
    # El script discrimina automáticamente según la Directiva UE de cambio de hora
    - cron: '10 5,6,8,11,13,14,15,16,17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo Simulación (Dry Run): Verifica sin publicar ni mover archivos'
        required: false
        type: boolean
        default: false
      specific_video:
        description: 'Clave específica en R2 (opcional, ej: queue/moraig.mp4)'
        required: false
        type: string
        default: ''

concurrency:
  group: publish-reels
  cancel-in-progress: false

jobs:
  publish_reel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Daily Reels Publisher
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      run: |
        CMD="python publish_instagram_reel.py"
        if [ "${{ github.event_name }}" = "schedule" ]; then
          CMD="$CMD --check-schedule"
        fi
        if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
          CMD="$CMD --dry-run"
        fi
        if [ -n "${{ github.event.inputs.specific_video }}" ]; then
          CMD="$CMD --video \"${{ github.event.inputs.specific_video }}\""
        fi
        echo "Ejecutando: $CMD"
        eval $CMD
