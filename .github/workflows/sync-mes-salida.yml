name: Sync Mes de Salida

on:
  workflow_run:
    workflows: ["Auto Sync Excursions"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ejecutar en modo prueba (sin escribir cambios en WooCommerce)'
        required: false
        default: true
        type: boolean

jobs:
  sync-mes-salida:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sincronización de Mes de Salida
        env:
          STORE_URL: ${{ secrets.STORE_URL }}
          WOO_CONSUMER_KEY: ${{ secrets.WOO_CONSUMER_KEY }}
          WOO_CONSUMER_SECRET: ${{ secrets.WOO_CONSUMER_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python sync_mes_salida.py
