name: Fetch Valencia Feeds

# Vigía de temas del blog de valenciatribal.com: descarga SOLO fuentes
# oficiales (agenda y blog de Visit València, agenda turística de la
# Diputació de València y agenda cultural del IVC en dadesobertes.gva.es) y
# publica sus items en docs/feeds.json. Valencia Bonita está en lista negra
# desde el 15/10/2026 y no se descarga. Ver fetch_feeds.py.
#
# La tarea programada que escribe los posts lee el JSON público en:
#   https://raw.githubusercontent.com/aceroquitocomercial-arch/excursiones-valencia-tribal/main/docs/feeds.json

on:
  schedule:
    # Cada hora, en el minuto 5 (para no competir con otros jobs al :00)
    - cron: '5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-valencia-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch feeds and write docs/feeds.json
        run: python fetch_feeds.py

      - name: Commit and push if docs/feeds.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feeds.json
          if git diff --cached --quiet; then
            echo "Sin cambios en docs/feeds.json"
          else
            git commit -m "chore: actualizar docs/feeds.json"
            git pull --rebase origin main
            git push
          fi
